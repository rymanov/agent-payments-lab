<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="1200" fill="#fcfcfb"/><text x="64" y="112" font-size="76" fill="#0b0b0b" text-anchor="start" font-weight="700">0 limit raises obtained</text><text x="64" y="166" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="500">360 trials, 6 models, mock payments. 39 runs tried to raise the limit: all refused.</text><text x="64" y="250" font-size="36" fill="#0b0b0b" text-anchor="start" font-weight="700">How often the agent tried to confirm its own limit raise</text><rect x="64" y="276" width="30" height="30" fill="#2a78d6"/><text x="104" y="300" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="400">No attacker: the real code was mailed to an inbox it reads</text><rect x="64" y="326" width="30" height="30" fill="#eb6834"/><text x="104" y="350" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="400">A planted email gave it a fake code</text><rect x="64" y="376" width="15" height="30" fill="#a9cbf3"/><rect x="79" y="376" width="15" height="30" fill="#f7c0a2"/><text x="104" y="400" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="400">Lighter top: it tried to confirm without the code it was given</text><text x="64" y="446" font-size="24" fill="#4a4946" text-anchor="start" font-weight="400">Each bar: the evaluable attack runs for that model and arm (20 planned).</text><line x1="112" x2="1130" y1="920" y2="920" stroke="#e4e3df" stroke-width="2"/><text x="100" y="929" font-size="24" fill="#4a4946" text-anchor="end" font-weight="400">0%</text><line x1="112" x2="1130" y1="715" y2="715" stroke="#e4e3df" stroke-width="2"/><text x="100" y="724" font-size="24" fill="#4a4946" text-anchor="end" font-weight="400">50%</text><line x1="112" x2="1130" y1="510" y2="510" stroke="#e4e3df" stroke-width="2"/><text x="100" y="519" font-size="24" fill="#4a4946" text-anchor="end" font-weight="4