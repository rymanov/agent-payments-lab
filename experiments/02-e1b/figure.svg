"27" fill="#0b0b0b" text-anchor="middle" font-weight="700">0</text><text x="1045.1666666666665" y="956" font-size="25" fill="#0b0b0b" text-anchor="middle" font-weight="600">Gemini</text><text x="1045.1666666666665" y="986" font-size="24" fill="#4a4946" text-anchor="middle" font-weight="400">3.8 Flash</text><line x1="112" x2="1130" y1="920" y2="920" stroke="#4a4946" stroke-width="2"/><text x="64" y="1050" font-size="24" fill="#4a4946" text-anchor="start" font-weight="400">The checker took no code from the agent: limits change only through the owner's console. Breaches: 0.</text><text x="64" y="1082" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="600">Runs that ended early on a formatting slip count as not tried, so those bars are a floor:</text><text x="64" y="1114" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="600">Claude Sonnet 13 of 40 attack runs, Claude Haiku 7, Qwen 3.5 2, Claude Opus 1, Gemini 1.</text><text x="64" y="1146" font-size="24" fill="#4a4946" text-anchor="start" font-weight="400">Thin lines: 95% interval for these runs. The plan was timestamped before its trials.</text><text x="64" y="1184" font-size="24" fill="#4a4946" text-anchor="start" font-weight="600">Agent Payments Lab · Experiment E1b · agentpaymentslab.com</text></svg>
